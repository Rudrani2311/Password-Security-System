<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Security System</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <table class="popup-table">
        <tr>
            <td>Password expiry system</td>
            <td id="btn-toggle-system" class="clickable">ON</td>
        </tr>
        <tr>
            <td>Current website:</td>
            <td id="current-website">-</td>
        </tr>
        <tr>
            <td id="btn-password-check" class="clickable">Password check:</td>
            <td>
                <input type="password" id="password-check-input" placeholder="Enter password" autocomplete="off">
            </td>
        </tr>
        <tr>
            <td id="btn-track-website" class="clickable">Track website</td>
            <td id="track-status"></td>
        </tr>
        <tr>
            <td id="status-verified">Verified</td>
            <td id="status-not-verified">Not Verified</td>
        </tr>
        <tr>
            <td id="btn-settings" class="clickable">Settings</td>
            <td></td>
        </tr>
    </table>
    <script src="crypto.js"></script>
    <script src="hibp.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
</body>
</html>
