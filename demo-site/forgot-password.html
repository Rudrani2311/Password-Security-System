<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student portal — Forgot password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="single-layout">
        <div class="card">
            <h1 class="card-title">Forgot password</h1>
            <p class="card-subtitle">Verify your email OTP and enter a new password that meets all security requirements.</p>

            <div class="status-panel">
                <div class="status-row">
                    <span>Account email:</span>
                    <span class="status-value">24bcs10304@cuchd.in</span>
                </div>
                <div class="status-row">
                    <span>Email OTP status:</span>
                    <span class="status-value">OTP 482910 verified</span>
                </div>
            </div>

            <form id="reset-password-form" action="index.html" method="GET">
                <input type="hidden" name="rotated" value="1">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="reset-email">Email:</label>
                    <input type="email" id="reset-email" value="24bcs10304@cuchd.in" required autocomplete="username">
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label for="new-password-input">New password:</label>
                    <input type="password" id="new-password-input" placeholder="Enter new password" required autocomplete="new-password">
                </div>

                <button type="submit" class="primary-btn" id="btn-update-password">Update password</button>
            </form>

            <div class="footer-row">
                <a href="index.html" class="link-btn">Back to sign in</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
